---
# Fixed: was "hosts: web", which matches nothing in inventory.ini
# (the actual host alias is "webserver"). Play was silently a no-op.
- hosts: webserver
  become: yes
  tasks:
    - name: Install Apache
      apt:
        name: apache2
        state: present

    - name: Start Apache
      service:
        name: apache2
        state: started
