[webservers]
webserver ansible_host=192.168.52.3 ansible_user=webserver

[dbservers]
dbserver ansible_host=192.168.52.4 ansible_user=dbserver

[fileservers]
fileserver ansible_host=192.168.52.6 ansible_user=fileserver

[backupservers]
backupserver ansible_host=192.168.52.5 ansible_user=backupserver

# Fixed: healthcare.yml targeted "hosts: healthcare", but no such group
# existed anywhere in this file, so that play matched zero hosts and
# Netdata was never actually deployed. This group covers every critical
# service host so the monitoring dashboard sees the whole environment.
[healthcare:children]
webservers
dbservers
fileservers
backupservers
